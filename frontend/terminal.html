<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RailOps - Escolha do terminal</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="pagina-terminal">
    <header class="cabecalho">
        <div>
            <strong>RailOps</strong>
            <span>Passagem de Serviço Ferroviária</span>
        </div>
        <button type="button" id="sair" class="botao-secundario">Sair</button>
    </header>

    <main class="conteudo-terminal">
        <section class="selecao-terminal" aria-labelledby="titulo-terminal">
            <p class="etapa">Nova passagem de serviço</p>
            <h1 id="titulo-terminal">Selecione o terminal</h1>
            <p class="instrucao">
                Escolha onde o turno foi realizado para abrir o formulário correto.
            </p>

            <div class="cartoes-terminal">
                <a class="cartao-terminal" href="./brisamar.html">
                    <span class="sigla-terminal" aria-hidden="true">BR</span>
                    <span>
                        <strong>Pátio Brisamar</strong>
                        <small>Linhas 16, 18, 20, 22, 24, 26, 28 e 30</small>
                    </span>
                    <span class="seta" aria-hidden="true">→</span>
                </a>

                <a class="cartao-terminal" href="./tecon.html">
                    <span class="sigla-terminal" aria-hidden="true">TC</span>
                    <span>
                        <strong>Terminal TECON</strong>
                        <small>Viaduto, linhas, desvios e Funil</small>
                    </span>
                    <span class="seta" aria-hidden="true">→</span>
                </a>
            </div>
        </section>
    </main>

    <script src="./js/terminal.js"></script>
</body>
</html>
