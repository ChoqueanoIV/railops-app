<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RailOps - Passagem registrada</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="pagina-confirmacao">
    <header class="cabecalho">
        <div>
            <strong>RailOps</strong>
            <span>Passagem de Serviço Ferroviária</span>
        </div>
        <button type="button" id="sair" class="botao-secundario">Sair</button>
    </header>

    <main class="conteudo-confirmacao">
        <section class="cartao-confirmacao" aria-labelledby="titulo-confirmacao">
            <span class="icone-sucesso" aria-hidden="true">✓</span>
            <p class="etapa">Registro concluído</p>
            <h1 id="titulo-confirmacao">Passagem enviada com sucesso</h1>
            <p class="instrucao">
                Os dados foram registrados e vinculados ao seu usuário.
            </p>

            <dl class="resumo-confirmacao">
                <div>
                    <dt>Terminal</dt>
                    <dd id="confirmacao-terminal"></dd>
                </div>
                <div>
                    <dt>Data</dt>
                    <dd id="confirmacao-data"></dd>
                </div>
                <div>
                    <dt>Turma</dt>
                    <dd id="confirmacao-turma"></dd>
                </div>
                <div>
                    <dt>Turno</dt>
                    <dd id="confirmacao-turno"></dd>
                </div>
                <div class="protocolo-confirmacao">
                    <dt>Protocolo</dt>
                    <dd id="confirmacao-protocolo"></dd>
                </div>
            </dl>

            <div class="acoes-confirmacao">
                <a id="editar-passagem" href="#"
                    class="botao-secundario link-botao" hidden>
                    Editar esta passagem
                </a>
                <a id="preencher-outro-terminal" href="./terminal.html"
                    class="botao-principal link-botao">
                    Preencher passagem do outro terminal agora
                </a>
                <a href="./terminal.html" class="link-secundario">
                    Concluir e voltar ao início
                </a>
            </div>
        </section>
    </main>

    <script src="./js/terminal.js"></script>
    <script src="./js/confirmacao.js"></script>
</body>
</html>
