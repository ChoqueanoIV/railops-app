<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RailOps - Login</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="pagina-login">
    <main>
        <section>
            <h1>RailOps</h1>
            <p>Passagem de Serviço Ferroviária</p>

            <form id="login-form">
                <div>
                    <label for="matricula">Matrícula</label>
                    <input
                        type="text"
                        id="matricula"
                        name="matricula"
                        required
                        autocomplete="username"
                        inputmode="numeric"
                        minlength="8"
                        maxlength="8"
                        pattern="[0-9]{8}"
                        title="A matrícula deve conter exatamente 8 números"
                    >
                </div>

                <div id="campo-codigo-ativacao" class="oculto">
                    <label for="codigo-ativacao">Código de ativação</label>
                    <input
                        type="password"
                        id="codigo-ativacao"
                        name="codigo_ativacao"
                        autocomplete="one-time-code"
                        inputmode="numeric"
                        minlength="6"
                        maxlength="6"
                        pattern="[0-9]{6}"
                        title="O código de ativação deve conter exatamente 6 números"
                    >
                </div>

                <div>
                    <label for="pin" id="pin-label">PIN</label>
                    <input
                        type="password"
                        id="pin"
                        name="pin"
                        required
                        autocomplete="current-password"
                        inputmode="numeric"
                        minlength="4"
                        maxlength="4"
                        pattern="[0-9]{4}"
                        title="O PIN deve conter exatamente 4 números"
                    >
                </div>

                <div id="campo-confirmacao-pin" class="oculto">
                    <label for="confirmacao-pin">Confirmar novo PIN</label>
                    <input
                        type="password"
                        id="confirmacao-pin"
                        name="confirmacao_pin"
                        autocomplete="new-password"
                        inputmode="numeric"
                        minlength="4"
                        maxlength="4"
                        pattern="[0-9]{4}"
                        title="A confirmação deve conter exatamente 4 números"
                    >
                </div>

                <button type="submit" id="submit-button">Entrar</button>
            </form>

            <p id="alternar-modo-texto">
                <span id="alternar-modo-pergunta">Primeiro acesso?</span>
                <button type="button" id="primeiro-acesso">
                    Definir meu PIN
                </button>
            </p>

            <p id="mensagem" role="alert"></p>
        </section>
    </main>
    <script src="./js/login.js"></script>
</body>
</html>
