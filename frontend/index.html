<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RailOps - Login</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <main>
        <section>
            <h1>RailOps</h1>
            <p>Passagem de Serviço Ferroviária</p>

            <form id="login-form">
                <div>
                    <label for="matricula">Matrícula</label>
                    <input
                        type="text"
                        id="matricula"
                        name="matricula"
                        required
                        autocomplete="username"
        inputmode="numeric"
        minlength="8"
        maxlength="8"
        pattern="[0-9]{8}"
        title="A matrícula deve conter exatamente 8 números"
                    >
                </div>

                <div>
                    <label for="pin">PIN</label>
                    <input
                        type="password"
                        id="pin"
                        name="pin"
                        required
                        autocomplete="current-password"
        inputmode="numeric"
        minlength="4"
        maxlength="4"
        pattern="[0-9]{4}"
        title="O PIN deve conter exatamente 4 números"
                    >
                </div>

                <button type="submit">Entrar</button>
            </form>

            <p>
                Primeiro acesso?
                <button type="button" id="primeiro-acesso">
                    Definir meu PIN
                </button>
            </p>

            <p id="mensagem" role="alert"></p>
        </section>
    </main>
    <script src="./js/login.js"></script>
</body>
</html>
