[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["backend/app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["backend/alembic"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
files = ["backend/app", "backend/main.py"]
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "app.models.*"
disable_error_code = ["assignment"]

[[tool.mypy.overrides]]
module = "app.services.passagem_service"
disable_error_code = ["arg-type", "return-value", "union-attr"]

[[tool.mypy.overrides]]
module = "app.routers.passagem_router"
disable_error_code = ["arg-type", "misc"]
