[project]
name = "railops-app"
version = "0.1.0"
description = "API para passagens de serviço ferroviárias"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic==1.18.5",
    "bcrypt==4.0.1",
    "fastapi==0.141.1",
    "passlib==1.7.4",
    "psycopg2-binary==2.9.12",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "python-jose[cryptography]==3.5.0",
    "sqlalchemy==2.0.51",
    "tzdata==2026.3; sys_platform == 'win32'",
    "uvicorn==0.52.1",
]

[dependency-groups]
test = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
]
dev = [
    { include-group = "test" },
    "mypy==1.20.2",
    "pre-commit==4.6.2",
    "ruff==0.16.3",
]

[tool.uv]
package = false
default-groups = ["dev"]
constraint-dependencies = [
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "anyio==4.14.2",
    "cffi==2.1.1",
    "click==8.4.2",
    "colorama==0.4.6",
    "cryptography==50.0.0",
    "ecdsa==0.19.2",
    "greenlet==3.5.4",
    "h11==0.16.0",
    "idna==3.18",
    "mako==1.3.12",
    "markupsafe==3.0.3",
    "pyasn1==0.6.4",
    "pycparser==3.0",
    "rsa==4.9.1",
    "six==1.17.0",
    "starlette==1.3.1",
    "typing-extensions==4.16.0",
    "typing-inspection==0.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["backend/app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["backend/alembic"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.13"
files = ["backend/app", "backend/main.py"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true
