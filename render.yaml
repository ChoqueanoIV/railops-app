services:
  - type: web
    name: railops-api-piloto
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: >-
      sh -c 'alembic upgrade head && exec uvicorn app.main:app
      --host 0.0.0.0 --port ${PORT:-8000}'
    healthCheckPath: /ready
    envVars:
      - key: RAILOPS_ENV
        value: production
      - key: API_TITLE
        value: RailOps API
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
