name: railops-e2e

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: railops_e2e
      POSTGRES_USER: railops_e2e
      POSTGRES_PASSWORD: railops-e2e-only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railops_e2e -d railops_e2e"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://railops_e2e:railops-e2e-only@db:5432/railops_e2e
      JWT_SECRET_KEY: railops-e2e-only-not-a-production-secret
      RAILOPS_ENV: test
      API_TITLE: RailOps API E2E
      CORS_ORIGINS: http://127.0.0.1:4173
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "18000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)
      interval: 3s
      timeout: 3s
      start_period: 10s
      retries: 20
    init: true
    read_only: true
    tmpfs:
      - /tmp

  seed:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://railops_e2e:railops-e2e-only@db:5432/railops_e2e
      JWT_SECRET_KEY: railops-e2e-only-not-a-production-secret
      RAILOPS_ENV: test
      CORS_ORIGINS: http://127.0.0.1:4173
    command: ["python", "-m", "scripts.seed_e2e"]
    depends_on:
      backend:
        condition: service_healthy
    profiles: ["tools"]
    read_only: true
    tmpfs:
      - /tmp
